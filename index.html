<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Cosmic Games | Космические Неоновые Игры</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="stars3"></div>

  <header class="header">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <span class="logo-text">NEON COSMIC</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="nav-link active">Игры</a>
      <a href="scores.html" class="nav-link">Рекорды</a>
      <a href="about.html" class="nav-link">О сайте</a>
      <a href="privacy.html" class="nav-link">Конфиденциальность</a>
    </nav>
  </header>

  <main class="main">
    <section class="hero">
      <h1 class="hero-title">КОСМИЧЕСКИЕ<br><span class="neon-text">НЕОНОВЫЕ ИГРЫ</span></h1>
      <p class="hero-subtitle">Погрузись в будущее. Квизы, аркады и вызовы из другой галактики.</p>
    </section>

    <section class="games-grid" id="games">
      <!-- Game cards will be rendered by JS -->
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Neon Cosmic Games • Сделано с ❤️ в космосе</p>
    <div class="footer-links">
      <a href="privacy.html">Политика конфиденциальности</a>
      <a href="about.html">О проекте</a>
    </div>
  </footer>

  <!-- Game Modals -->
  <div id="game-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="game-container"></div>
    </div>
  </div>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
